name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  lint-unit:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        php: ['7.1', '8.2', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring
          tools: none
      - name: php -l (module)
        run: find WorkflowPacks -name '*.php' -not -name '*.blade.php' -print0 | xargs -0 -n1 php -l > /dev/null
      - name: Unit tests (no FreeScout needed)
        run: php tests/unit/run.php
      - name: shellcheck
        if: matrix.php == '8.2'
        run: shellcheck install.sh tools/build-release.sh tests/integration/run.sh

  schema:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save ajv@8.17.1 && node tests/schema/validate.js

  integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: FreeScout + Workflows test stub + PHPUnit (Docker)
        run: bash tests/integration/run.sh

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint-unit, schema, integration]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches module.json
        run: |
          v="$(sed -n 's/^[[:space:]]*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' WorkflowPacks/module.json | head -n 1)"
          test "v${v}" = "${GITHUB_REF_NAME}"
      - name: Build archive
        run: bash tools/build-release.sh
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/WorkflowPacks.zip
            dist/install.sh
            dist/module.json
            dist/SHA256SUMS
