name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  lint-unit:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        php: ['7.1', '8.2', '8.4']
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring
          tools: none
      - name: php -l (module)
        run: find WorkflowPacks -name '*.php' -not -name '*.blade.php' -print0 | xargs -0 -n1 php -l > /dev/null
      - name: Unit tests (no FreeScout needed)
        run: php tests/unit/run.php
      - name: shellcheck
        if: matrix.php == '8.2'
        run: shellcheck install.sh tools/build-release.sh tests/integration/run.sh tests/update/run.sh

  schema:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm install --no-save ajv@8.17.1 && node tests/schema/validate.js
      - name: Diagram scripts (syntax + automatic layouts)
        run: |
          for f in WorkflowPacks/Public/js/graph/*.js WorkflowPacks/Public/js/*.js; do node --check "$f"; done
          for t in tests/js/*.test.js; do node "$t"; done

  integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: FreeScout + Workflows test stub + PHPUnit (Docker)
        run: bash tests/integration/run.sh

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint-unit, schema, integration]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Check the tag matches module.json
        run: |
          v="$(sed -n 's/^[[:space:]]*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' WorkflowPacks/module.json | head -n 1)"
          test "v${v}" = "${GITHUB_REF_NAME}"
      - name: Build archive
        run: bash tools/build-release.sh
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/WorkflowPacks.zip
            dist/install.sh
            dist/module.json
            dist/SHA256SUMS

  # After each release: update from older versions to the release just published (CLI, "Update now" button through
  # the scheduler, install.sh), with checks of version, rollback, migrations, data kept (tests/update/run.sh)
  update-e2e:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Update from older versions to the latest release
        run: bash tests/update/run.sh
      - name: Results
        if: always()
        run: cat tests/update/last-run.md
