name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  lint-unit:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        php: ['7.1', '8.2', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring
          tools: none
      # every warning shown: a deprecation (e.g. PHP 8.4 implicit nullable types) fails, it would stop the module on
      # instances that turn them into errors
      - name: php -l (module and tests, every warning is an error)
        run: |
          out="$(find WorkflowPacks tests -name '*.php' -not -name '*.blade.php' -print0 \
            | xargs -0 -n1 php -d error_reporting=-1 -d display_errors=1 -l 2>&1 | grep -v '^No syntax errors detected' || true)"
          if [ -n "$out" ]; then printf '%s\n' "$out"; exit 1; fi
      - name: Unit tests (no FreeScout needed)
        run: php -d error_reporting=-1 tests/unit/run.php
      - name: shellcheck
        if: matrix.php == '8.2'
        run: shellcheck install.sh tools/build-release.sh tests/integration/run.sh tests/update/run.sh

  scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Scripts of the pages (syntax) and of the flow editor (tests)
        run: |
          for f in WorkflowPacks/Public/js/*.js WorkflowPacks/Public/js/flows/*.js; do node --check "$f"; done
          for t in tests/js/*.test.js; do node "$t"; done

  integration:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        php: ['8.2', '8.5']
    steps:
      - uses: actions/checkout@v5
      - name: FreeScout + PHPUnit (Docker, PHP ${{ matrix.php }})
        run: PHP_VERSION=${{ matrix.php }} bash tests/integration/run.sh

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint-unit, scripts, integration]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Check the tag matches module.json
        run: |
          v="$(sed -n 's/^[[:space:]]*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' WorkflowPacks/module.json | head -n 1)"
          test "v${v}" = "${GITHUB_REF_NAME}"
      - name: Build archive
        run: bash tools/build-release.sh
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/WorkflowPacks.zip
            dist/install.sh
            dist/module.json
            dist/version.txt
            dist/SHA256SUMS

  # After each release: update from older versions to the release just published, with FreeScout's own module update
  # (what UpdateGuard relies on) and install.sh; checks of version, health command, migrations, data kept
  # (tests/update/run.sh)
  update-e2e:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Update from older versions to the latest release
        run: bash tests/update/run.sh
      - name: Results
        if: always()
        run: cat tests/update/last-run.md
